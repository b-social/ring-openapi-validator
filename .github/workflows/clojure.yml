name: Clojure CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: latest
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
